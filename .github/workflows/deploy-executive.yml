name: Deploy Standalone Executive Workspace

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/app/executive/**"
      - "frontend/src/app/layout.tsx"
      - "frontend/src/app/globals.css"
      - "frontend/src/lib/api.ts"
      - "frontend/src/lib/executive.ts"
      - "frontend/public/**"
      - "frontend/scripts/build-executive.mjs"
      - "frontend/next.config.ts"
      - "frontend/package*.json"
      - "deploy/executive/publish.sh"
      - ".github/workflows/deploy-executive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executive-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the standalone export
        working-directory: frontend
        run: |
          npm ci
          npm run build:executive
          tar -czf executive.tgz -C out-executive \
            executive _next/static favicon.svg Ires-icon.png icon.png apple-icon.png

      - name: Publish to the executive site
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/executive_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          remote="ubuntu@$EC2_HOST"
          incoming=".crm-executive-releases/$RELEASE_ID"
          ssh -i ~/.ssh/executive_deploy "$remote" "umask 077 && mkdir -p '$incoming'"
          scp -i ~/.ssh/executive_deploy frontend/executive.tgz deploy/executive/publish.sh "$remote:$incoming/"
          ssh -i ~/.ssh/executive_deploy "$remote" "bash '$incoming/publish.sh' '$incoming/executive.tgz' '$RELEASE_ID'"
