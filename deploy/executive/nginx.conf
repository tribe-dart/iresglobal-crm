server {
    listen 127.0.0.1:8517;
    server_name master.innovativeelectivegroup.com;

    root /var/www/crm-executive/current;
    index index.html;
    absolute_redirect off;

    location = / {
        return 302 /executive/;
    }

    location = /executive {
        return 302 /executive/;
    }

    location ^~ /_next/static/ {
        root /var/www/crm-executive;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(executive/|favicon\.svg$|Ires-icon\.png$|icon\.png$|apple-icon\.png$) {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/crm-api/api/(executive|auth/(login|logout))$ {
        rewrite ^/crm-api(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host api-crm.iresglobal.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_domain iresglobal.com master.innovativeelectivegroup.com;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Powered-By;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}
